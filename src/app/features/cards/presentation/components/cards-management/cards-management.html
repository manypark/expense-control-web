<section aria-labelledby="cards-title" class="rounded-2xl border border-default bg-gray-100 p-4 sm:p-6 lg:p-7">
    <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex items-center gap-3">
            <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-blue-700">
                <svg class="h-6 w-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8h18v10H3V8Zm3 4h5m8 0h.01M6 16h4" />
                </svg>
            </span>
            <h2 id="cards-title" class="text-2xl font-bold text-heading">Gestión de Tarjetas</h2>
        </div>

        <div class="w-full sm:w-36">
            <app-common-button
                type="button"
                text="+ Nueva Tarjeta"
                loadingText="Cargando..."
                [loading]="false"
                [disabled]="false" />
        </div>
    </div>

    <div class="grid gap-5">
        @if ( !cardsServices.accountsQuery.isPending() && cards().length > 0 ) {
            @for (card of cards(); track card.id) {
                <article
                    class="grid gap-4 rounded-2xl bg-white p-5 sm:grid-cols-[auto_1fr_auto] sm:items-center sm:gap-6 lg:p-6"
                    [class.border-2]="true"
                    [class.border-blue-700]="true"
                    [class.border]="!true"
                    [class.border-blue-500]="!true">
                    <div class="flex h-10 w-14 items-center justify-center rounded-md border border-blue-200 bg-blue-50 text-blue-700">
                        <svg class="h-6 w-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16v10H4V8Zm4 4h8" />
                        </svg>
                    </div>
    
                    <div class="min-w-0">
                        <h3 class="truncate text-lg font-bold text-heading">{{ card.alias }}</h3>
                        <p class="mt-1 truncate text-sm font-bold tracking-wide text-body">{{ card.bank }}</p>
                        <div class="mt-4 mb-2 flex items-center  gap-x-4">
                            <p class="text-sm font-medium uppercase text-gray-500">Límite</p>
                            <p class="font-bold text-gray-900">${{ card.creditLimit | number:'1.2-2' }}</p>
                        </div>
                    </div>

    
                    <div class="flex items-center gap-4 sm:justify-end">
                        <button type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-lg text-blue-700 hover:bg-blue-50" aria-label="Editar tarjeta">
                            <svg class="h-5 w-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m14.304 4.844 2.852 2.852M7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-4.5m2.409-9.91a2.017 2.017 0 0 1 0 2.853l-6.844 6.844L8 14l.713-3.565 6.844-6.844a2.015 2.015 0 0 1 2.852 0Z" />
                            </svg>
                        </button>
                        <button type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-lg text-red-600 hover:bg-red-50" aria-label="Eliminar tarjeta">
                            <svg class="h-5 w-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 7h14m-9 3v8m4-8v8M10 3h4a1 1 0 0 1 1 1v3H9V4a1 1 0 0 1 1-1ZM6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7Z" />
                            </svg>
                        </button>
                    </div>
                </article>
            }
        }
    </div>
</section>
