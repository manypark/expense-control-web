<nav class="sticky top-0 z-50 w-full border-b border-default bg-gray-100 shadow-sm">
    <div class="mx-auto flex max-w-8xl flex-wrap items-center justify-between gap-3 px-4 py-3 sm:px-8 lg:px-10">
        <a [routerLink]="['/home/dashboard']" (click)="closeMenu()" class="flex items-center gap-3">
            <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-blue-600 text-lg font-bold text-white shadow-md shadow-blue-500/30">
                CG
            </span>
            <span class="text-xl font-bold text-heading">Control Gastos</span>
        </a>

        <button
            type="button"
            (click)="toggleMenu()"
            class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-default-medium text-body hover:bg-neutral-tertiary-medium hover:text-heading focus:outline-none focus:ring-2 focus:ring-brand md:hidden"
            aria-controls="navbar-sticky"
            [attr.aria-expanded]="isMenuOpen()">
            <span class="sr-only">Abrir menú principal</span>
            <svg class="h-5 w-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
            </svg>
        </button>

        <div id="navbar-sticky" class="w-full md:block md:w-auto" [class.hidden]="!isMenuOpen()">
            <ul class="mt-4 flex flex-col gap-2 rounded-lg border border-default bg-neutral-primary-soft p-3 font-medium md:mt-0 md:flex-row md:items-center md:border-0 md:bg-transparent md:p-0">
                @for (item of navItems; track item.route; let index = $index) {
                    <li>
                        <a
                            [routerLink]="[item.route]"
                            (click)="closeMenu()"
                            class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm transition-colors hover:bg-neutral-tertiary-medium hover:text-heading md:hover:bg-white"
                            [class.bg-white]="selectedIndex === index"
                            [class.text-blue-700]="selectedIndex === index"
                            [class.font-bold]="selectedIndex === index"
                            [class.text-body]="selectedIndex !== index">
                            <svg
                                class="h-5 w-5 shrink-0"
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24">
                                <path
                                    stroke="currentColor"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    [attr.d]="item.icon" />
                            </svg>
                            <span>{{ item.label }}</span>
                        </a>
                    </li>
                }
            </ul>
        </div>
    </div>
</nav>

<router-outlet></router-outlet>
