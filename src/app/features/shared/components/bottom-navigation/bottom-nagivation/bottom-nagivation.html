<router-outlet></router-outlet>

<div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 h-16 w-full px-2 lg:max-w-4xl bg-gray-100 backdrop-blur-lg rounded-2xl">

    <div class="relative h-full">

        <!-- Indicador deslizante -->
        <div class="absolute top-1 bottom-1 w-1/5 bg-white rounded-2xl shadow-lg transition-all duration-300 ease-out" [style.transform]="'translateX(' + (selectedIndex * 100) + '%)'"></div>

        <!-- Botones -->
        <div class="grid h-full grid-cols-5 mx-auto font-medium relative z-10">

            <!-- Inicio -->
            <button [routerLink]="['/home/dashboard']" type="button" class="inline-flex flex-col items-center justify-center rounded-2xl transition-all duration-300">

                <svg
                    class="w-6 h-6 mb-1 transition-all duration-300"
                    [class.scale-110]="selectedIndex === 0"
                    [class.-translate-y-1]="selectedIndex === 0"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24">
                    <path
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="m4 12 8-8 8 8M6 10.5V19a1 1 0 0 0 1 1h3v-3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3h3a1 1 0 0 0 1-1v-8.5" />
                </svg>

                <span class="text-sm transition-all duration-300" [class.font-bold]="selectedIndex === 0">
                    Inicio
                </span>

            </button>

            <!-- Gastos -->
            <button [routerLink]="['/home/expenses']" type="button" class="inline-flex flex-col items-center justify-center px-5 rounded-2xl transition-all duration-300">

                <svg
                    class="w-6 h-6 mb-1 transition-all duration-300"
                    [class.scale-110]="selectedIndex === 1"
                    [class.-translate-y-1]="selectedIndex === 1"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24">
                    <path
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M17 8H5m12 0a1 1 0 0 1 1 1v2.6M17 8l-4-4M5 8a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.6M5 8l4-4 4 4m6 4h-4a2 2 0 1 0 0 4h4a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1Z" />
                </svg>

                <span class="text-sm transition-all duration-300" [class.font-bold]="selectedIndex === 1">
                    Gastos
                </span>

            </button>

            <!-- Servicios -->
            <button [routerLink]="['/home/services']" type="button" class="inline-flex flex-col items-center justify-center px-5 rounded-2xl transition-all duration-300">

                <svg
                    class="w-6 h-6 mb-1 transition-all duration-300"
                    [class.scale-110]="selectedIndex === 2"
                    [class.-translate-y-1]="selectedIndex === 2"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24">
                    <path
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 4h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3m0 3h6m-6 5h6m-6 4h6M10 3v4h4V3h-4Z" />
                </svg>

                <span class="text-sm transition-all duration-300" [class.font-bold]="selectedIndex === 2">
                    Servicios
                </span>

            </button>

            <!-- Analítica -->
            <button [routerLink]="['/home/analitycs']" type="button" class="inline-flex flex-col items-center justify-center px-5 rounded-2xl transition-all duration-300">

                <svg
                    class="w-6 h-6 mb-1 transition-all duration-300"
                    [class.scale-110]="selectedIndex === 3"
                    [class.-translate-y-1]="selectedIndex === 3"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24">
                    <path
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M3 15v4m6-6v6m6-4v4m6-6v6M3 11l6-5 6 5 5.5-5.5" />
                </svg>

                <span class="text-sm transition-all duration-300" [class.font-bold]="selectedIndex === 3">
                    Analítica
                </span>

            </button>

            <!-- Tarjetas -->
            <button [routerLink]="['/home/cards']" type="button" class="inline-flex flex-col items-center justify-center px-5 rounded-2xl transition-all duration-300">

                <svg
                    class="w-6 h-6 mb-1 transition-all duration-300"
                    [class.scale-110]="selectedIndex === 4"
                    [class.-translate-y-1]="selectedIndex === 4"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24">
                    <path
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M3 10h18M6 14h2m3 0h5M3 7v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1Z" />
                </svg>

                <span class="text-sm transition-all duration-300" [class.font-bold]="selectedIndex === 4">
                    Tarjetas
                </span>
            </button>
        </div>
    </div>
</div>
