<div class="grid" [class]="gap()">
    <h3 [class]="classTitle()"> {{ title() }} </h3>
    <select
        [id]="id()"
        [value]="value()"
        [disabled]="disabled()"
        (change)="onChange($event)"
        class="input-rounded">

        <option value=""> {{ placeholder() }} </option>

        @for (option of options(); track option.value) {
            <option [value]="option.value"> {{ option.label }} </option>
        }
    </select>
</div>
