<main class="w-full min-h-screen bg-[#EBF0FF] px-4 pb-28 pt-6 sm:px-8 lg:px-10">

   <div class="mx-auto grid max-w-8xl mt-10 gap-20 mb-20">
      <div class="w-full flex justify-between">
   
         <div>
            <h2 class="text-3xl font-bold">Gastos</h2>
            <p>Gestiona y analiza tus egresos mensuales</p>
         </div>

         <div class="w-60">
            <app-common-button 
            type="submit"
            text="+ Registrar Gastos"
            loadingText="Cargando..."
            [loading]="false"
            [disabled]="false"/>
         </div>
   
      </div>

      <div class="flex justify-between">

         <div class="grid rounded-2xl bg-linear-to-r from-blue-500 via-blue-600 to-blue-700 w-3xs p-10 gap-y-2 shadow-[#3B69FF] shadow-lg">
            <h2 class="text-white text-3xl">Total Mes</h2>
            <p class="text-white text-2xl"> $ 6,768.69 </p>
         </div>

         <div class="p-8 px-12 rounded-2xl w-4/5 border-2 border-white bg-gray-100 shadow-md sm:p-7">
            <div class="flex justify-between">

               <div class="grid gap-y-4">
                  <h3 class="text-2xl">Categorias</h3>
                  <form class="max-w-sm mx-auto">
                     <select id="countries" class="block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body">
                        <option selected> Selecciona una categoria </option>
                        <option value="US">Alimentos</option>
                        <option value="CA">Salud</option>
                        <option value="FR">Compras</option>
                        <option value="DE">Entretenimiento</option>
                        <option value="DE">Servicios</option>
                        <option value="DE">Educación</option>
                        <option value="DE">Transporte</option>
                        <option value="DE">Viajes</option>
                        <option value="DE">Otros</option>
                     </select>
                  </form>
               </div>

               <div class="grid gap-y-4">
                  <h3 class="text-2xl"> Rango de fechas </h3>
                  <div id="date-range-picker" date-rangepicker class="flex items-center">
                  <div class="relative">
                     <div class="absolute inset-y-0 inset-s-0 flex items-center ps-3 pointer-events-none">
                        <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z"/></svg>
                     </div>
                     <input id="datepicker-range-start" name="start" type="text" class="block w-full ps-9 pe-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand px-3 shadow-xs placeholder:text-body" placeholder="Fecha inicial">
                  </div>
                  <span class="mx-4 text-body">to</span>
                  <div class="relative">
                     <div class="absolute inset-y-0 inset-s-0 flex items-center ps-3 pointer-events-none">
                        <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z"/></svg>
                     </div>
                     <input id="datepicker-range-end" name="end" type="text" class="block w-full ps-9 pe-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand px-3 shadow-xs placeholder:text-body" placeholder="Fecha final">
                  </div>
                  </div>
               </div>

               <div class="flex justify-center items-center">
                  <app-common-button
                  class="w-52"
                  type="submit"
                  text="Filtrar"
                  loadingText="Cargando..."
                  [loading]="false"
                  [disabled]="false"/>
               </div>

            </div>
         </div>
      </div>
   </div>

   <app-common-table></app-common-table>

</main>
