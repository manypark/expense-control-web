<section class="fade-in-element">
  <div class="mb-8 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h2 class="text-lg font-bold text-gray-900">Tendencia mensual de gastos</h2>
      <p class="mt-1 text-sm font-medium text-gray-500">Total acumulado por mes</p>
    </div>
  </div>

  @if ( expenseMonthlyServices.expensesQuery.isPending() ) {
    <div class="animate-pulse">
      <div class="mb-5 h-52 rounded-lg bg-gray-200"></div>
      <div class="grid grid-cols-6 gap-3">
        <div class="h-4 rounded bg-gray-200"></div>
        <div class="h-4 rounded bg-gray-200"></div>
        <div class="h-4 rounded bg-gray-200"></div>
        <div class="h-4 rounded bg-gray-200"></div>
        <div class="h-4 rounded bg-gray-200"></div>
        <div class="h-4 rounded bg-gray-200"></div>
      </div>
    </div>
  } @else if ( monthlyExpenses().length === 0 ) {
    <div class="flex h-72 items-center justify-center rounded-lg border border-dashed border-gray-300 text-sm font-medium text-gray-500">
      No hay gastos registrados.
    </div>
  } @else {
    <div #monthlyChart class="min-h-75 w-full"></div>
  }
</section>
