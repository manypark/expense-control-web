<section class="bg-gray-100 h-max dark:bg-gray-900">
  <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
      <a class="flex items-center mb-6 text-4xl font-semibold text-gray-900 dark:text-white">
          Control Gastos App
      </a>
      <div class="w-full bg-white rounded-md shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-700">
          <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
              <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white">
                  Crea tu cuenta
              </h1>
              <form class="space-y-4 md:space-y-6" action="#">
                  <div>
                      <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"> Tu correo </label>
                      <input type="email" name="email" id="email" autocomplete="off" class="input-rounded" placeholder="name@company.com" required="">
                  </div>
                  <div>
                      <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"> Contraseña </label>
                      <input type="password" name="password" id="password" placeholder="••••••••" class="input-rounded" required="">
                  </div>
                  <div>
                      <label for="confirm-password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"> Confirma tu contraseña </label>
                      <input type="confirm-password" name="confirm-password" id="confirm-password" placeholder="••••••••" class="input-rounded" required="">
                  </div>
                  <div class="flex items-start">
                      <label class="inline-flex items-center cursor-pointer">
                            <input type="checkbox" value="" class="sr-only peer">
                            <div class="relative w-9 h-5 bg-neutral-quaternary peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-brand-soft dark:peer-focus:ring-brand-soft rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-buffer after:content-[''] after:absolute after:top-0.5 after:inset-s-0.5 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-brand"></div>
                            <span class="select-none ms-3 text-sm font-medium text-heading"> Acepto los terminos y condiciones </span>
                        </label>
                  </div>
                  <button type="submit" class="w-full text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-md text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">Create an account</button>
                  <p class="text-sm font-light text-gray-500 dark:text-gray-400">
                      Ya tienes una cuenta? <a [routerLink]="['/auth/sing-in']" class="font-medium text-blue-500 hover:underline dark:text-primary-500"> Inicia sesión aqui</a>
                  </p>
              </form>
          </div>
      </div>
  </div>
</section>
